<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .mystyle
    {
        color:black;
        font-size: 30px;
        font-family: 'Courier New', Courier, monospace;
        cursor: pointer;
        width: 200px;
        box-shadow: 10px 10px 10px gray;
        padding: 10px;
        background:pink;
    }
</style>
<div id ="clock"class="mystyle"></div>
<body>
    

<script>
    var b = document.getElementById("clock")
    var s;
    function run_clock()
    {
        var d = new date()
        b.innerHTML = d.tolocaleTimeString()
        s = d.getSeconds()
        if(s>10)
    {
        document.bgColor ="green"
    }
    if(s>20)
    {
        document.bgColor="yellow"
    }
    if(s==40)
    {
        alert("hello friends")
    }

    }
    var t = setInterval("run_clock()",1000)
    b.onclick =function()
    {
        clearInterval(t)
    
    }
    b.onmouseout =function()
    {
        var t = setInterval("run_clock()",1000)
    }
</script>
</body>
</html>
