<!doctype html >
<html lang="en" data-bs-theme ="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body >
     <div class="container " ></div>
     <h1 style="text-align: center;"> Bootstrap Button</h1>
     <p style="text-align: center;"> Bootstrap includes several button variants, each serving its own semantic purpose, with a few extras thrown in for more control.</p>
     <button class="btn btn-success">Home</button>
     <button class="btn btn-danger">About</button>
     <button class="btn btn-warning">Placement</button>
     <button class="btn btn-light">Courses</button>
     <button class="btn btn-primary">Contact</button>
     <br/>
     <p>Link</p>
     <button type="button" class="btn btn-link">Bootstrap</button>
     <br/>

    <p>Outline buttons</p>
    <button type="button" class="btn btn-outline-primary">Primary</button>
<button type="button" class="btn btn-outline-secondary">Secondary</button>
<button type="button" class="btn btn-outline-success">Success</button>
<button type="button" class="btn btn-outline-danger">Danger</button>
<button type="button" class="btn btn-outline-warning">Warning</button>
<br/>
<p>Sizes</p>
<button type="button" class="btn btn-primary btn-lg">Large button</button>
<button type="button" class="btn btn-primary btn-sm">Small button</button>
<br/>
<p>Custom Button</p>
<button type="button" class="btn btn-primary"
        style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;">
  Custom button
</button>
<br/>
<p>Block buttons</p>
<div class="d-grid gap-2">
  <button class="btn btn-primary " type="button">Button</button>
  <button class="btn btn-primary" type="button">Button</button>
</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
