<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="mycan" ></canvas>
    <script>
        var a = document.getElementById("mycan")
        var w = window.innerWidth
        var h = window.innerHeight
         var s = 10
         var x = 30
         var y = 30
         var drawmode = false
        a.width= w
        a.height= h
         
        var c = a.getContext("2d");
        c.fillStyle="red"

        function draw(e)
        {
            x = e.pageX
            y = e.pageY
            
            c.beginPath();
            if(drawmode)
        {
            c.arc(x ,y ,s ,0 , 2 *Math.PI);

        }
        c.fill()

        }
        function setdrawmode()
        {
            if(!drawmode)
        {
            drawmode=true
        }
        else
        {
            drawmode=false
        }
        }
        function f1(e)
        {
            if((e.key == '+')&&(s<50))
        {
          s+=2

        }
        if((e.key =='-')&&(s>5))
        {
            s-=2
        }
        if (e.key=='c')
        c.clearRect(0,0,w,h)
        }
         a.addEventListener("mousemove",draw)
         a.addEventListener("mousedown",setdrawmode)
         document.addEventListener("keydown",f1)
        </script>
</body>
</html>
