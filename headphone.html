<meta name="viewport"content="width=device-width,initial-scale=1.0">
<style>
@keyframes zoomout 
{
from{transform:scale(3);}
to{transform:scale(1);}
} 
header
{
text-align: center;
}
body
{
background:grey;
background-image:url(images/texture.jpg);

}
.picstyle 
{

height:660px;

}

{

body
