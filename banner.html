<header>Change background Days Wise</header>
<h4><a href="javascript.html">Back</a></h4>

<h1><img id="pic" src ="images/bk2.jpg"></h1>
<body onload="show()">

    
    <script>
        
       var p1 = document.getElementById("pic")

        
        var today = 2
         
         
            if(today<7)
            {
                today++
            }
            else
            {
                today = 0            
            }
            document.title = today
           
        if(today==1)
            {
                
                  p1.src="images/banner.gif"
            }
            if(today==2)
            {
              
                      p1.src="images/school.gif"
            }
            if(today==3)
            {
                
                      p1.src="https://cdn.pixabay.com/animation/2026/05/02/02/00/02-00-36-874_512.gif"
            }
            if(today==4)
            {
              
                     p1.src="https://cdn.pixabay.com/animation/2023/09/26/12/59/12-59-04-420_512.gif"
            }
            if(today==5)
            {
                
                      p1.src="https://cdn.pixabay.com/animation/2024/02/19/13/10/13-10-06-4_512.gif"
            }
            if(today==6)
            {
                      p1.src="https://cdn.pixabay.com/animation/2023/01/22/12/01/12-01-10-410_512.gif"
            }
            if(today==0)
            {
              
                      p1.src="https://cdn.pixabay.com/animation/2024/01/10/14/45/14-45-54-336_512.gif"
            }
          
            
    </script>
</body>
