<style>
@keyframes runbanner
{
10%{left:0px;}

 20%{left:-14.3%;}
30%{left:-14.3%;}

40%{left:-28.6%;}
50%{left:-28.6%;}

60%{left:-42.9%;}
70%{left:-42.9%;}

80%{left:-57.2%;}
90%{left:-57.2%;}

100%{left:-71.5%;}
110%{left:-71.5%}
}
body
{
background:#fffff0;
margin:0px;
padding:0px;
}
header
{
background:#00072d;
color:white;
text-align:center;

height:70px;
font-size:30px;
padding-top:15px;
}
h6
{
text-align:center;
}
h6 img
{

width:2%;
margin-top:-20px;
}
main
{
width:700%;
height:450px;
//background:red;
}
.pic
{
width:14%;
height:550px;
//margin-left:-4px;
position:relative;
padding:15px;
box-shadow:10px 10px 10px;
animation:runbanner 20s infinite alternate ;
}
