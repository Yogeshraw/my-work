<body>
    <script>

      var n = prompt("Enter a Number to create A Table","2")

        document.write("<h1>Table of "+n+"</h1>")

        for(var i = 1;i<=10;i++)
            { 
                document.write("<h3>"+n+"❌"+i+"="+n*i+"</h3>")

               }
               document.title ="no"
    </script>
