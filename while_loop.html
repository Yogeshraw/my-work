<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body
    {
        margin: 0;
        padding:0;
        text-align: center;
        

    }
    .mystyle
    {
        width:60px;
        height: 60px;
        border-radius: 100px;
        cursor: all-scroll;
        margin-top: 20px;
        margin-left: 20px;
        
        
    }
    header
    {
        height:50px;
        text-align: center;
        font-size: 34px;
        background:black;
        color: white;
        
        width:100%;
        box-sizing: border-box;
        padding-top: 5px;

    }
</style>
<header>While Loop</header>
<h4><a href="javascript.html">Back</a></h4>
<body>
    <script>
        /* using loop - "while Loop"*/

    var a = 1 
    var c = 1
    var r,g,b,mycolor




    while(a<=40)
    {

      r = Math.round(Math.random()*255)
      
      g = Math.round(Math.random()*255) 
      b = Math.round(Math.random()*255)  
       mycolor ="rgb("+r+","+g+","+b+")"
       

       document.title = mycolor

        document.write("<button style='background:"+mycolor+"'class='mystyle' onclick='show(this)'>"+a+"</button>")
         
        a++
        if(c<=5)
    {
        c++
    }
    else
    {
        document.write("<br>")
        c=1
    }

    function show(t)
    {
        document.body.style.background = t.style.background
    }
    }
     
    </script>
     
</body>

</html>
