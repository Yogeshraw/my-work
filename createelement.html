<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body
    {
        margin:0px;
        padding:0px;
    }
   header
    {
        background:black;
        color:white;
        width:100%;
        height:50px;
        text-align:center;
        padding:10px;
        box-sizing: border-box;
        font-size:20px;

    }
</style>
<body>
   <header>Creating Element in javascript</header>
    <script>
        var p = document.createElement("img")
        document.body.appendChild(p)
        p.src = "images/mountain.jpg"
        p.style ="width:30%;cursor:pointer;"
        p.style.boxShadow="10px 10px 10px"
        p.style.borderRadius="10px"
        p.style.margin="10px"

   

        p.onclick = function()
        {
        p.src="images/dairymilk.jpg"
        }
        p.onmouseout = function()
        {
            p.src="images/mountain.jpg"

        }

    </script>
</body>
</html>
