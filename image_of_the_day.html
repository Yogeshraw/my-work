    }
    header
    {
        background: white;
        color:black;
        width:100%;
        height: 50px;
        text-align: center;
        box-sizing: border-box;
        font-size: 24px;

     }
     h4
     {

     {

     {

     h1{
        text-align: center;
     }
     h1 #pic
     {
      width: 70%;

<header>Change Banner Days Wise</header>
<h4><a href="javascript.html">Back</a></h4>

<h1><img id="pic" src ="images/bk2.jpg"></h1>
<body>
    <div id ="mes" ></div>
    <script>
        
        var mes = document.getElementById("mes")

        var p1 = document.getElementById("pic")

        var d = new Date()
        var today = d.getDay()
         
          document.title = today
            //today = 0
        if(today==1)
            {
                mes.innerHTML = "Image of Monday"
                  p1.src="images/bk1.jpg"
            }
            if(today==2)
            {
                mes.innerHTML = "Image of Tuesday"
                      p1.src="images/bk2.jpg"
            }
            if(today==3)
            {
                mes.innerHTML = "Image of wednesday"
                      p1.src="images/mountain.jpg"
            }
            if(today==4)
            {
                mes.innerHTML = "Image of Thursday"
                     p1.src="images/manipulation.jpg"
            }
            if(today==5)
            {
                mes.innerHTML = "Image of Friday"
                      p1.src="images/m6.png"
            }
            if(today==6)
            {
                mes.innerHTML = "Image of Saturday"
                      p1.src="images/m5.png"
            }
            if(today==0)
            {
                mes.innerHTML = "Image of Sunday"
                      p1.src="images/m2.png"
            }
            
            
    </script>
</body>

</html>
