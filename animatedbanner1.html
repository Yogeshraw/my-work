<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
<style>
    header
    {
        text-align: center;
        font-size: 24px;
        font-style: normal;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        height: 50px;
        box-sizing: border-box;
        color:white;
        background-color:cornflowerblue;
        padding:10px;
    }
    body{
        background: lightgray;
        padding: 0;
    margin: 0;
    }
    .pic
    {
     position: absolute;
     top:120px;
     left:350px;
     width: 50%;
     height: 400px;
     transition:2s;
     box-shadow: 10px 10px 10px gray;
    }
</style>
<header>
    Create Animated Banner
</header>
<body onload="anibanner()">
    <h1 >
        <img class="pic" src="images/burger.jpg" id="p1">
         <img class="pic" src="images/manipulation.jpg" id="p2">
          <img class="pic" src="images/mountain.jpg" id="p3">
           <img class="pic" src="images/banner.gif" id="p4">
            <img class="pic" src="images/dairymilk.jpg" id="p5">
    </h1>
    <script>
        var p1 = document.getElementById("p1")
         var p2 = document.getElementById("p2")
          var p3 = document.getElementById("p3")
           var p4 = document.getElementById("p4")
            var p5 = document.getElementById("p5")
            var c = 0

            function anibanner()
            { 
                switch(c)
                {
                case 1:
                    p5.style.opacity= "0"
                    p5.classList.add("animate__animated","animate__pulse")
                    break;
                    case 2:
                    p4.style.opacity= "0"
                    p4.classList.add("animate__animated","animate__pulse")
                    break;
                    case 3:
                    p3.style.opacity= "0"
                    p3.classList.add("animate__animated","animate__pulse")
                    case 4:
                    p2.style.opacity= "0"
                    p2.classList.add("animate__animated","animate__pulse")
                    break;
                    case 5:
                      p2.style.opacity= "1"
                    p2.classList.remove("animate__animated","animate__pulse")  
                    p3.style.opacity= "1"
                    p3.classList.remove("animate__animated","animate__pulse")  
                    p4.style.opacity= "1"
                    p4.classList.remove("animate__animated","animate__pulse")  
                    p5.style.opacity= "1"
                    p5.classList.remove("animate__animated","animate__pulse")  
                    
                    
                    break;
                }
                 if(c<=5)
                 {
                    c++
                 }
                 else
                 {
                    c=1
                 }
                 setTimeout("anibanner()",3000)


                }

    </script>
</body>
</html>
