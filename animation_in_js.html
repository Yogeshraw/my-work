<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #bird {
        width: 20%;
        position: absolute;
        top: 0px;
        left: 0px;
    }
</style>

<body>
    <img id="bird" src="https://cdn.pixabay.com/animation/2024/01/31/12/40/12-40-41-791_512.gif">
<script>
    
    var bird = document.getElementById("bird")
    
    var L = 0
    function f1(e)
    {
        alert(e.keycode)
        var a = e.key
        switch(a)
        {
         case "ArrowRight": 
         
            if(L<window.innerWidth-200)
        {
            L=L+5
        }
        else{
            L = -200
        }

        bird.style.left = L+"px"
        document.title = L
        break;
    }
    }
</script>
</body>

</html>
