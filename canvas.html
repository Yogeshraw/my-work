<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    canvas
    {
      
        background-color: rgb(28, 28, 53);
        

    }
</style>
<body>
    <canvas id="mycan" width="1000" height="1000"style="border:1px black solid"></canvas>
    <script>
        var a = document.getElementById("mycan")
        var w = window.innerWidth
        var h = window.innerHeight
         
        a.width= w
        a.height= h
        var c = a.getContext("2d");
        c.beginPath();
         c.arc(365, 250, 250, 0, 2 * Math.PI)
         c.fillStyle="green"
         c.fill();  
        c.fillStyle="brown"
        c.fillRect(320, 300, 100, 500)
          c.beginPath();
         c.arc(200, 250, 35, 0, 2 * Math.PI)
         c.fillStyle="lightgreen"
          c.fill();
          c.beginPath();
         c.arc(450, 200, 20, 0, 2 * Math.PI)
         c.fillStyle="lightgreen"
          c.fill(); 
          c.beginPath();
         c.arc(365, 250, 80, 0, 2 * Math.PI)
         c.fillStyle="green"
         c.fill();
         c.beginPath();
         c.arc(450, 100, 20, 0, 2 * Math.PI)
         c.fillStyle="darkgreen"
          c.fill(); 
          c.beginPath();
         c.arc(500, 300, 40, 0, 2 * Math.PI)
         c.fillStyle="darkgreen"
          c.fill();  
          c.beginPath();

          c.fill();

          c.fill(); 
           c.beginPath();

          c.fill();
          c.beginPath();
          c.arc(250, 700, 65, 0, 2 * Math.PI)

          c.fill();
           c.beginPath();
          c.arc(185, 700, 80, 0, 2 * Math.PI)
         c.fillStyle="darkgreen"
          c.fill();
          c.beginPath();
          c.arc(100, 700, 70, 0, 2 * Math.PI)
         c.fillStyle="darkgreen"
          c.fill();
          c.beginPath();
          c.arc(55, 700, 100, 0, 2 * Math.PI)
         c.fillStyle="darkgreen"
          c.fill();
           c.beginPath();
          c.arc(420, 700, 50, 0, 2 * Math.PI)
         c.fillStyle="darkgreen"
          c.fill();
          c.beginPath();

          c.fill();
           c.beginPath();
          c.arc(550, 700, 80, 0, 2 * Math.PI)

          c.fill();
          c.beginPath();
          c.arc(660, 700, 100, 0, 2 * Math.PI)
         c.fillStyle="darkgreen"
          c.fill();
           c.beginPath();
          c.arc(800, 700, 120, 0, 2 * Math.PI)
         c.fillStyle="darkgreen"
          c.fill();
          c.beginPath();
          c.arc(800, 100, 95, 0, 2 * Math.PI)
         c.fillStyle="gray";
          c.fill();
          c.fillStyle="lightgray"
        c.fillRect(1200, 0, 500, 800)

          
    </script>
</body>
</html>
